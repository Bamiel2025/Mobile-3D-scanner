<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile 3D Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        .camera-container { position: relative; width: 100%; height: 70vh; background: #000; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanning-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; background: rgba(0, 0, 0, 0.5); }
        .scanning-grid { position: absolute; width: 80%; height: 60%; border: 2px dashed rgba(255, 255, 255, 0.7); top: 10%; left: 10%; pointer-events: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto bg-white min-h-screen">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 shadow-md flex items-center justify-between">
            <h1 class="text-xl font-bold">3D Scanner</h1>
        </header>
        
        <!-- Tabs -->
        <div class="flex border-b">
            <button class="tab-btn flex-1 py-3 font-medium text-indigo-600 border-b-2 border-indigo-600" data-tab="scan">Scanner</button>
            <button class="tab-btn flex-1 py-3 font-medium text-gray-500" data-tab="models">Modèles</button>
        </div>

        <!-- Scan Tab -->
        <div id="scan" class="tab-content active p-4">
            <div class="camera-container mb-4 rounded-lg overflow-hidden">
                <video id="video" autoplay playsinline></video>
                <div class="scanning-grid"></div>
                <div id="scanningOverlay" class="scanning-overlay hidden">
                    <div class="mb-4 text-lg font-bold">Scan en cours...</div>
                    <div class="text-white text-sm">Déplacez lentement autour de l'objet</div>
                </div>
            </div>
            <div class="flex justify-center space-x-4 mb-6">
                <button id="startScanBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-medium flex items-center">
                    <span class="mr-2">&#9654;</span>Démarrer
                </button>
                <button id="stopScanBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full font-medium flex items-center hidden">
                    <span class="mr-2">&#9632;</span>Arrêter
                </button>
                <button id="captureBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-2 rounded-full font-medium hidden">📸 Capturer</button>
            </div>
            <div id="photoCount" class="text-center mb-4 text-gray-600">0 / 10 photos</div>
            <div class="text-center mb-4">
                <button id="generateModelBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-full font-medium hidden">Générer Modèle 3D</button>
            </div>
            <div id="scanHelp" class="text-center text-sm text-gray-600">Déplacez doucement autour de l'objet pour capturer des photos</div>
        </div>

        <!-- Models Tab -->
        <div id="models" class="tab-content p-4">
            <div class="mb-4">
                <h2 class="text-xl font-bold mb-3">Vos modèles</h2>
                <div id="noModels" class="text-center py-10 text-gray-500">
                    <p>Aucun modèle pour l'instant.</p>
                </div>
                <!-- Section de visualisation -->
                <div id="viewer" style="width: 100%; height: 500px; margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/examples/js/loaders/OBJLoader.js"></script>
    <script>
        /**
         * Fonction pour charger et afficher un modèle 3D
         * @param {string} modelUrl - URL du fichier du modèle 3D
         */
        function load3DModel(modelUrl) {
            const viewer = document.getElementById('viewer');
            viewer.innerHTML = ''; // Réinitialiser le contenu du viewer

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, viewer.offsetWidth / 500, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(viewer.offsetWidth, 500);
            viewer.appendChild(renderer.domElement);

            const loader = new THREE.OBJLoader();
            loader.load(modelUrl, function (obj) {
                scene.add(obj);
                camera.position.z = 5;

                function animate() {
                    requestAnimationFrame(animate);
                    obj.rotation.y += 0.01; // Faire tourner le modèle
                    renderer.render(scene, camera);
                }
                animate();
            }, undefined, function (error) {
                console.error('Erreur lors du chargement du modèle :', error);
            });
        }

        // Exemple d'appel : Charger un modèle 3D
        // load3DModel('http://localhost:5000/output/model.obj'); // Remplacez par l'URL réelle
    </script>
    <script>
// Constants and Variables
const MIN_PHOTOS = 10;
let capturedImages = [];
let videoStream = null;

// DOM Element References
const videoEl = document.getElementById('video');
const startScanBtn = document.getElementById('startScanBtn');
const stopScanBtn = document.getElementById('stopScanBtn');
const captureBtn = document.getElementById('captureBtn');
const generateModelBtn = document.getElementById('generateModelBtn');
const scanningOverlay = document.getElementById('scanningOverlay');
const photoCountEl = document.getElementById('photoCount');
const scanHelpEl = document.getElementById('scanHelp'); // Assuming scanHelp is the ID for the help text element

// Tab elements
const tabButtons = document.querySelectorAll('.tab-btn');
const tabContents = document.querySelectorAll('.tab-content');
const scanTabBtn = document.querySelector('.tab-btn[data-tab="scan"]'); // Specific reference if needed
const modelsTabBtn = document.querySelector('.tab-btn[data-tab="models"]'); // Specific reference if needed
const scanTabContent = document.getElementById('scan');
const modelsTabContent = document.getElementById('models');


// Update Photo Count Function
function updatePhotoCount() {
    photoCountEl.textContent = `${capturedImages.length} / ${MIN_PHOTOS} photos`;
}

// Tab Switching Logic
function switchTab(tabName) {
    tabContents.forEach(content => {
        if (content.id === tabName) {
            content.classList.add('active');
        } else {
            content.classList.remove('active');
        }
    });
    tabButtons.forEach(button => {
        if (button.dataset.tab === tabName) {
            button.classList.add('text-indigo-600', 'border-indigo-600');
            button.classList.remove('text-gray-500');
        } else {
            button.classList.remove('text-indigo-600', 'border-indigo-600');
            button.classList.add('text-gray-500');
        }
    });
}

// Camera Handling Functions
async function startCamera() {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoEl.srcObject = videoStream;
            videoEl.play(); // Ensure video plays

            startScanBtn.classList.add('hidden');
            stopScanBtn.classList.remove('hidden');
            captureBtn.classList.remove('hidden');
            scanningOverlay.classList.remove('hidden');
            scanHelpEl.textContent = "Alignez l'objet dans la grille et capturez des photos sous différents angles.";
            generateModelBtn.classList.add('hidden'); // Hide generate button until enough photos are taken
        } else {
            alert('getUserMedia n\'est pas supporté par ce navigateur.');
            scanHelpEl.textContent = 'Erreur: getUserMedia n\'est pas supporté.';
        }
    } catch (error) {
        console.error("Erreur lors du démarrage de la caméra: ", error);
        alert("Impossible d'accéder à la caméra. Vérifiez les permissions et réessayez.");
        scanHelpEl.textContent = "Erreur d'accès à la caméra. Vérifiez les permissions.";
        // Ensure UI resets if camera fails to start
        stopScanBtn.classList.add('hidden');
        captureBtn.classList.add('hidden');
        startScanBtn.classList.remove('hidden');
        scanningOverlay.classList.add('hidden');
    }
}

function stopCamera() {
    if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoEl.srcObject = null; // Clear video source
    }
    videoStream = null; // Reset videoStream variable

    startScanBtn.classList.remove('hidden');
    stopScanBtn.classList.add('hidden');
    captureBtn.classList.add('hidden');
    scanningOverlay.classList.add('hidden');
    scanHelpEl.textContent = "Déplacez doucement autour de l'objet pour capturer des photos";
    // Do not hide generateModelBtn if it was already visible
    if (capturedImages.length < MIN_PHOTOS) {
        generateModelBtn.classList.add('hidden');
    }
}

// Image Capture Function
function capturePhoto() {
    if (!videoStream) {
        alert("La caméra n'est pas active. Démarrez le scan d'abord.");
        return;
    }
    if (capturedImages.length < MIN_PHOTOS) {
        // Placeholder for actual image data - for now, just a string
        const imagePlaceholder = `image_data_placeholder_${capturedImages.length + 1}`;
        capturedImages.push(imagePlaceholder);
        updatePhotoCount();
        scanHelpEl.textContent = `Photo ${capturedImages.length} capturée! Continuez à capturer sous différents angles.`;

        if (capturedImages.length >= MIN_PHOTOS) {
            generateModelBtn.classList.remove('hidden');
            scanHelpEl.textContent = `Nombre minimum de photos atteint (${MIN_PHOTOS}). Vous pouvez générer le modèle.`;
            // Optionally disable capture button if MIN_PHOTOS is a hard limit
            // captureBtn.classList.add('hidden'); 
        }
    } else {
        // Alert if trying to capture more than MIN_PHOTOS, if it's a hard limit
        // For now, we allow more, as the original code implies it might be a minimum
        alert(`Vous avez déjà capturé le nombre minimum de ${MIN_PHOTOS} photos. Prêt à générer le modèle.`);
    }
}

// Event Listeners
document.addEventListener('DOMContentLoaded', () => {
    // Initial UI setup
    stopScanBtn.classList.add('hidden');
    captureBtn.classList.add('hidden');
    generateModelBtn.classList.add('hidden');
    scanningOverlay.classList.add('hidden'); // Ensure overlay is hidden initially

    updatePhotoCount(); // Initial call to set photo count text

    // Set "Scanner" tab as active by default
    switchTab('scan'); 

    // Attach event listeners
    startScanBtn.addEventListener('click', startCamera);
    stopScanBtn.addEventListener('click', stopCamera);
    captureBtn.addEventListener('click', capturePhoto);

    tabButtons.forEach(button => {
        button.addEventListener('click', () => switchTab(button.dataset.tab));
    });

    // Ensure the models tab initially shows "no models" message if it's empty
    const modelsContainer = document.getElementById('viewer'); // Or a more specific container for models list
    if (modelsTabContent.classList.contains('active') && (!modelsContainer || modelsContainer.children.length === 0)) {
        document.getElementById('noModels').style.display = 'block';
    } else if (modelsContainer && modelsContainer.children.length > 0) {
         document.getElementById('noModels').style.display = 'none';
    }
});

async function sendImagesToServer(images) {
    try {
        const response = await fetch('http://localhost:5000/process-images', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ images }) // Envoyer les images capturées
        });

        if (!response.ok) {
            throw new Error('Erreur lors de l’envoi des images au serveur');
        }

        const result = await response.json();

        // Vérifiez si le modèle a été généré avec succès
        if (result.modelUrl) {
            alert('Modèle 3D généré avec succès ! Chargement du modèle...');
            load3DModel(`http://localhost:5000${result.modelUrl}`); // Charger automatiquement le modèle
        } else {
            alert('Erreur : Le modèle n’a pas pu être généré.');
        }

        return result;
    } catch (error) {
        console.error('Erreur:', error);
        alert('Une erreur est survenue lors de la génération du modèle 3D.');
    }
}

// Bouton générer le modèle
generateModelBtn.addEventListener('click', async () => {
    if (capturedImages.length < MIN_PHOTOS) {
        alert("Vous devez capturer au moins 10 photos avant de générer le modèle.");
        return;
    }

    scanHelpEl.textContent = "Envoi des images au serveur pour génération du modèle 3D...";
    generateModelBtn.disabled = true;

    const result = await sendImagesToServer(capturedImages);

    generateModelBtn.disabled = false;
    capturedImages = [];
    updatePhotoCount();

    if (result) {
        scanHelpEl.textContent = "Modèle 3D chargé avec succès. Vous pouvez le visualiser ci-dessous.";
    } else {
        scanHelpEl.textContent = "Une erreur est survenue. Veuillez réessayer.";
    }
});
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch(error => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
</body>
</html>
