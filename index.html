<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile 3D Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        .camera-container { position: relative; width: 100%; height: 70vh; background: #000; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanning-overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; background:rgba(0,0,0,0.5);}
        .scanning-grid { position: absolute; width: 80%; height: 60%; border: 2px dashed rgba(255,255,255,0.7); top:10%; left:10%; pointer-events:none;}
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white min-h-screen">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex items-center justify-between">
        <h1 class="text-xl font-bold">3D Scanner</h1>
    </header>
    <!-- Tabs -->
    <div class="flex border-b">
        <button class="tab-btn flex-1 py-3 font-medium text-indigo-600 border-b-2 border-indigo-600" data-tab="scan">Scanner</button>
        <button class="tab-btn flex-1 py-3 font-medium text-gray-500" data-tab="models">Modèles</button>
    </div>
    <!-- Scan Tab -->
    <div id="scan" class="tab-content active p-4">
        <div class="camera-container mb-4 rounded-lg overflow-hidden">
            <video id="video" autoplay playsinline></video>
            <div class="scanning-grid"></div>
            <div id="scanningOverlay" class="scanning-overlay hidden">
                <div class="mb-4 text-lg font-bold">Scan en cours...</div>
                <div class="text-white text-sm">Déplacez lentement autour de l'objet</div>
            </div>
        </div>
        <div class="flex justify-center space-x-4 mb-6">
            <button id="startScanBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-medium flex items-center">
                <span class="mr-2">&#9654;</span>Démarrer
            </button>
            <button id="stopScanBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full font-medium flex items-center hidden">
                <span class="mr-2">&#9632;</span>Arrêter
            </button>
        </div>
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h3 class="font-bold text-lg mb-2">Conseils de scan</h3>
            <ul class="text-sm text-gray-600 space-y-2">
                <li>Utilisez un bon éclairage</li>
                <li>Déplacez-vous lentement autour de l'objet</li>
                <li>Gardez l'objet centré</li>
            </ul>
        </div>
    </div>
    <!-- Models Tab -->
    <div id="models" class="tab-content p-4">
        <div class="mb-4">
            <h2 class="text-xl font-bold mb-3">Vos modèles</h2>
            <div id="noModels" class="text-center py-10 text-gray-500">
                <p>Aucun modèle pour l'instant.</p>
            </div>
        </div>
    </div>
</div>
<script>
let stream = null;
const video = document.getElementById('video');
const startScanBtn = document.getElementById('startScanBtn');
const stopScanBtn = document.getElementById('stopScanBtn');
const scanningOverlay = document.getElementById('scanningOverlay');

// Fonction pour démarrer la caméra
async function startCamera() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('getUserMedia non supporté');
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();
        return true;
    } catch (err) {
        alert("Impossible d'accéder à la caméra : " + err.message);
        return false;
    }
}

// Fonction pour arrêter la caméra
function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
    }
}

// Bouton démarrer scan
startScanBtn.addEventListener('click', async () => {
    const ok = await startCamera();
    if (!ok) return;
    startScanBtn.classList.add('hidden');
    stopScanBtn.classList.remove('hidden');
    scanningOverlay.classList.remove('hidden');
});

// Bouton arrêter scan
stopScanBtn.addEventListener('click', () => {
    stopCamera();
    startScanBtn.classList.remove('hidden');
    stopScanBtn.classList.add('hidden');
    scanningOverlay.classList.add('hidden');
});

// Gestion des onglets
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('text-indigo-600', 'border-indigo-600', 'text-gray-500'));
        btn.classList.add('text-indigo-600', 'border-indigo-600');
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
        // Arrêter la caméra si on quitte l'onglet scan
        if (btn.dataset.tab !== 'scan') {
            stopCamera();
            startScanBtn.classList.remove('hidden');
            stopScanBtn.classList.add('hidden');
            scanningOverlay.classList.add('hidden');
        }
    });
});

// Service Worker (PWA)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
</script>
</body>
</html>
