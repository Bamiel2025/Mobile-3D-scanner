<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile 3D Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        /* Custom styles */
        .camera-container {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            background-color: #000;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .scanning-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .scanning-grid {
            position: absolute;
            width: 80%;
            height: 60%;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }
        
        .progress-ring {
            position: relative;
            width: 100px;
            height: 100px;
        }
        
        .progress-ring__circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .preview-container {
            width: 100%;
            height: 300px;
            background-color: #f0f0f0;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        #previewCanvas {
            width: 100%;
            height: 100%;
        }
        
        .floating-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 3D viewer styles */
        #modelViewer {
            width: 100%;
            height: 300px;
            background-color: #2d3748;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto bg-white min-h-screen">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 shadow-md">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold">3D Scanner</h1>
                <button id="settingsBtn" class="text-white">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>
        
        <!-- Tabs -->
        <div class="flex border-b">
            <button class="tab-btn flex-1 py-3 font-medium text-indigo-600 border-b-2 border-indigo-600" data-tab="scan">
                <i class="fas fa-camera mr-2"></i>Scan
            </button>
            <button class="tab-btn flex-1 py-3 font-medium text-gray-500" data-tab="models">
                <i class="fas fa-cube mr-2"></i>Models
            </button>
        </div>
        
        <!-- Scan Tab -->
        <div id="scan" class="tab-content active p-4">
            <div class="camera-container mb-4 rounded-lg overflow-hidden">
                <video id="video" autoplay playsinline></video>
                <div class="scanning-grid"></div>
                <div id="scanningOverlay" class="scanning-overlay hidden">
                    <div class="progress-ring mb-4">
                        <svg viewBox="0 0 36 36">
                            <path
                                class="progress-ring__circle"
                                stroke="#ffffff"
                                stroke-width="2"
                                fill="none"
                                stroke-dasharray="100, 100"
                                d="M18 2.0845
                                    a 15.9155 15.9155 0 0 1 0 31.831
                                    a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                        </svg>
                        <span class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white font-bold" id="progressText">0%</span>
                    </div>
                    <p class="text-white font-medium">Scanning in progress...</p>
                    <p class="text-white text-sm mt-2">Move around the object slowly</p>
                </div>
            </div>
            
            <div class="flex justify-center space-x-4 mb-6">
                <button id="startScanBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-medium flex items-center">
                    <i class="fas fa-play mr-2"></i> Start Scan
                </button>
                <button id="stopScanBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full font-medium flex items-center hidden">
                    <i class="fas fa-stop mr-2"></i> Stop
                </button>
            </div>
            
            <div class="bg-white p-4 rounded-lg shadow mb-4">
                <h3 class="font-bold text-lg mb-2">Scan Tips</h3>
                <ul class="text-sm text-gray-600 space-y-2">
                    <li class="flex items-start">
                        <i class="fas fa-lightbulb text-yellow-500 mt-1 mr-2"></i>
                        <span>Use good lighting conditions</span>
                    </li>
                    <li class="flex items-start">
                        <i class="fas fa-lightbulb text-yellow-500 mt-1 mr-2"></i>
                        <span>Move slowly around the object</span>
                    </li>
                    <li class="flex items-start">
                        <i class="fas fa-lightbulb text-yellow-500 mt-1 mr-2"></i>
                        <span>Keep the object centered in frame</span>
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- Models Tab -->
        <div id="models" class="tab-content p-4">
            <div class="mb-4">
                <h2 class="text-xl font-bold mb-3">Your Scanned Models</h2>
                <div id="noModels" class="text-center py-10 text-gray-500">
                    <i class="fas fa-cube text-4xl mb-3"></i>
                    <p>No models yet. Start by scanning an object!</p>
                </div>
                
                <div id="modelList" class="space-y-4 hidden">
                    <!-- Model cards will be added here dynamically -->
                </div>
            </div>
        </div>
        
        <!-- Model Preview Modal -->
        <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-lg w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="font-bold text-lg">Model Preview</h3>
                    <button id="closePreviewModal" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="p-4">
                    <div id="modelViewer">
                        <!-- 3D model will be rendered here -->
                        <canvas id="previewCanvas"></canvas>
                    </div>
                    
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Model Name</label>
                        <input type="text" id="modelName" class="w-full px-3 py-2 border rounded-md" placeholder="Enter model name">
                    </div>
                    
                    <div class="mt-6 flex space-x-3">
                        <button id="exportStlBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md font-medium">
                            <i class="fas fa-download mr-2"></i> Export STL
                        </button>
                        <button id="deleteModelBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md font-medium">
                            <i class="fas fa-trash mr-2"></i> Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Settings Modal -->
        <div id="settingsModal" class="fixed inset
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered');
                    })
                    .catch(err => {
                        console.log('Service Worker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
