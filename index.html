<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geological Mapping Application</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <!-- Basic favicon, replace later if a custom one is made -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
</head>
<body>
    <div class="app-container">
        <div class="control-panel">
            <h1>Geological Map Viewer</h1>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search by location or GPS (lat,lon)">
                <button id="search-button">Search</button>
            </div>
            <div class="coordinates-display">
                <p>Map Center: <span id="map-center-coords">N/A</span></p>
            </div>
        </div>

        <div class="map-comparison-area">
            <div id="map-standard-container" class="map-container">
                <div id="map-standard" class="map"></div>
                <div class="map-label">Topographical Map</div>
            </div>
            
            <div id="map-geological-container" class="map-container">
                <div id="map-geological" class="map"></div>
                <div class="map-label">Geological Map (BRGM)</div>
            </div>

            <input type="range" min="0" max="100" value="50" class="slider" id="map-slider">
        </div>

        <div class="info-panel">
            <h2>Geological Information</h2>
            <div id="legend-container">
                <h3>Legend</h3>
                <!-- Legend will be populated here -->
                <div id="geological-legend"></div>
            </div>
            <div id="details-container">
                <h3>Details at Point</h3>
                <div id="geological-details">
                    <p>Click on the geological map to see details.</p>
                </div>
            </div>
            <div id="fossil-info-container">
                <h3>Fossil Information</h3>
                <div id="fossil-details">
                    <p>Associated fossil data will appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
